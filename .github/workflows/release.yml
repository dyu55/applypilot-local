name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Skill version tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require passing push CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh run list --workflow ci.yml --event push --commit "$TARGET_SHA" --json conclusion --jq '.[].conclusion' > ci-results.txt
          python - <<'PY'
          from pathlib import Path
          if 'success' not in Path('ci-results.txt').read_text().splitlines():
              raise SystemExit('Full push CI must pass for this exact commit before release.')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match VERSION.')
          PY
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_repository.py
      - run: python scripts/validate_skill.py
      - run: python -m pytest
      - run: python scripts/build_skill.py
      - name: Test extracted release skill
        run: python "${{ github.workspace }}/scripts/smoke_skill.py"
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-skill
          path: |
            dist/applypilot-local-v*.zip
            dist/SHA256SUMS.txt

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-skill
          path: dist
      - name: Publish GitHub skill release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/* --target "$TARGET_SHA" --title "ApplyPilot Local $RELEASE_TAG" --generate-notes
